<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barn Gym — Blueprint</title>
<style>
  html,body{margin:0;background:#0e2a4a;color:#dbeafe;font-family:'Courier New',ui-monospace,monospace;padding:10px;}
  .sheet{max-width:820px;margin:0 auto;background:#0e2a4a;border:2px solid #cfe3f7;}
  svg{width:100%;height:auto;display:block;}
  .ln{stroke:#cfe3f7;stroke-width:1.4;fill:none;}
  .lnT{stroke:#6fa8d6;stroke-width:0.8;fill:none;}
  .dim{stroke:#6fa8d6;stroke-width:0.7;}
  .fill{fill:#143a63;stroke:#cfe3f7;stroke-width:1.4;}
  .open{fill:#0f315a;stroke:#6fa8d6;stroke-width:0.8;}
  .water{stroke:#4aa3ff;stroke-width:1.6;fill:none;}
  .drain{stroke:#ff9a3c;stroke-width:1.6;fill:none;stroke-dasharray:5 3;}
  .elec{stroke:#46d39a;stroke-width:1.4;fill:none;}
  .septic{stroke:#d6b36a;stroke-width:1.6;fill:none;}
  .t{fill:#dbeafe;font-size:11px;}
  .ts{fill:#9fc4e6;font-size:9.5px;}
  .th{fill:#ffffff;font-size:14px;}
  .door{stroke:#cfe3f7;stroke-width:1.2;fill:none;}
  text{font-family:'Courier New',monospace;}
</style>
</head>
<body>
<div class="sheet">
<svg viewBox="0 0 820 1520" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="820" height="1520" fill="#0e2a4a"/>
  <rect x="10" y="10" width="800" height="1500" class="ln"/>

  <text x="28" y="40" class="th">TWO-CONTAINER BARN GYM + LOFT STUDIO</text>
  <text x="28" y="58" class="ts">SCHEMATIC SET · NOT FOR CONSTRUCTION · ALL DIMS &amp; MEP TO BE ENGINEERED / PERMITTED</text>

  <!-- ===================== GROUND FLOOR PLAN ===================== -->
  <text x="28" y="92" class="th">1 · GROUND FLOOR PLAN</text>
  <text x="28" y="108" class="ts">14 px = 1 ft · drive-through main floor</text>

  <!-- 32 x 20 ; origin 150,130 ; 14px/ft.  left 150-262, gap 262-486, right 486-598 ; depth 130-410 -->
  <rect x="150" y="130" width="112" height="280" class="fill"/>   <!-- left container -->
  <rect x="262" y="130" width="224" height="280" class="open"/>   <!-- center gap -->
  <rect x="486" y="130" width="112" height="280" class="fill"/>   <!-- right container -->

  <!-- left inner wall: cut open -->
  <line x1="262" y1="130" x2="262" y2="180" class="ln"/>
  <line x1="262" y1="360" x2="262" y2="410" class="ln"/>
  <!-- right inner wall: kept + door -->
  <line x1="486" y1="130" x2="486" y2="300" class="ln"/>
  <line x1="486" y1="330" x2="486" y2="410" class="ln"/>
  <path class="door" d="M486 300 A30 30 0 0 1 486 330"/>
  <!-- right-wing partitions: utility / sauna / plunge -->
  <line x1="486" y1="214" x2="598" y2="214" class="ln"/>
  <line x1="486" y1="298" x2="598" y2="298" class="ln"/>

  <!-- GARAGE DOORS on both center gable ends -->
  <rect x="304" y="125" width="140" height="8" fill="#0e2a4a" stroke="#cfe3f7" stroke-width="1.4"/>
  <rect x="304" y="407" width="140" height="8" fill="#0e2a4a" stroke="#cfe3f7" stroke-width="1.4"/>
  <text x="374" y="122" class="ts" text-anchor="middle">GARAGE DOOR (10')</text>
  <text x="374" y="426" class="ts" text-anchor="middle">GARAGE DOOR (10')</text>

  <!-- stairs: quarter-turn, back-left gym corner -->
  <rect x="266" y="134" width="44" height="70" class="lnT"/>
  <line x1="266" y1="146" x2="310" y2="146" class="lnT"/><line x1="266" y1="158" x2="310" y2="158" class="lnT"/>
  <line x1="266" y1="170" x2="310" y2="170" class="lnT"/><line x1="266" y1="182" x2="310" y2="182" class="lnT"/>
  <text x="288" y="214" class="ts" text-anchor="middle">STAIR UP ↑</text>

  <!-- platform + rack -->
  <rect x="318" y="220" width="112" height="100" class="lnT" stroke-dasharray="5 3"/>
  <text x="374" y="266" class="t" text-anchor="middle">DRIVE-THROUGH</text>
  <text x="374" y="282" class="t" text-anchor="middle">GYM FLOOR</text>
  <text x="374" y="300" class="ts" text-anchor="middle">rack · platform</text>

  <!-- left wing -->
  <text x="206" y="250" class="t" text-anchor="middle">GYM</text>
  <text x="206" y="266" class="ts" text-anchor="middle">storage /</text>
  <text x="206" y="280" class="ts" text-anchor="middle">dumbbells</text>

  <!-- right wing zones -->
  <text x="542" y="160" class="t" text-anchor="middle">UTILITY</text>
  <text x="542" y="174" class="ts" text-anchor="middle">WH · panel · chiller</text>
  <text x="542" y="260" class="t" text-anchor="middle">SAUNA</text>
  <text x="542" y="344" class="t" text-anchor="middle">COLD</text>
  <text x="542" y="358" class="t" text-anchor="middle">PLUNGE</text>

  <!-- windows (outer walls) -->
  <rect x="146" y="190" width="8" height="34" fill="#0e2a4a" stroke="#6fa8d6"/>
  <rect x="146" y="300" width="8" height="34" fill="#0e2a4a" stroke="#6fa8d6"/>
  <rect x="594" y="240" width="8" height="34" fill="#0e2a4a" stroke="#6fa8d6"/>
  <!-- man-doors front wall -->
  <rect x="190" y="406" width="30" height="8" fill="#0e2a4a" stroke="#cfe3f7"/>
  <text x="205" y="424" class="ts" text-anchor="middle">door</text>

  <!-- MEP LAYER -->
  <!-- electrical panel + feeder (green) -->
  <rect x="582" y="150" width="12" height="20" fill="#0e2a4a" stroke="#46d39a"/>
  <text x="588" y="146" class="ts" text-anchor="middle" fill="#46d39a">E</text>
  <path class="elec" d="M588 170 L588 200 L560 200"/>
  <path class="elec" d="M594 160 L660 160 L660 120"/>
  <text x="664" y="120" class="ts" fill="#46d39a">service feed (TBD)</text>
  <!-- water supply (blue) from utility -->
  <path class="water" d="M520 175 L520 250 L540 250"/>
  <path class="water" d="M520 175 L470 175 L470 70"/>
  <text x="474" y="66" class="ts" fill="#4aa3ff">water supply</text>
  <!-- drain to septic (orange dashed) -->
  <path class="drain" d="M540 330 L520 330 L520 360 L150 360 L150 470"/>
  <text x="300" y="356" class="ts" fill="#ff9a3c">waste / drain line ↓ to septic</text>

  <!-- SEPTIC tank + drain field (left, outside) -->
  <rect x="120" y="486" width="70" height="34" class="septic"/>
  <text x="155" y="507" class="ts" text-anchor="middle" fill="#d6b36a">SEPTIC TANK</text>
  <g>
    <line x1="120" y1="540" x2="300" y2="540" class="septic"/>
    <line x1="120" y1="556" x2="300" y2="556" class="septic"/>
    <line x1="120" y1="572" x2="300" y2="572" class="septic"/>
  </g>
  <text x="210" y="592" class="ts" fill="#d6b36a">DRAIN FIELD (size + direction per perc test)</text>
  <line x1="150" y1="470" x2="150" y2="486" class="septic"/>

  <!-- dims -->
  <line x1="150" y1="116" x2="262" y2="116" class="dim"/><text x="206" y="113" class="ts" text-anchor="middle">8'</text>
  <line x1="262" y1="116" x2="486" y2="116" class="dim"/><text x="374" y="113" class="ts" text-anchor="middle" opacity="0">16'</text>
  <line x1="486" y1="116" x2="598" y2="116" class="dim"/><text x="542" y="113" class="ts" text-anchor="middle">8'</text>
  <line x1="606" y1="130" x2="606" y2="410" class="dim"/><text x="614" y="275" class="ts" text-anchor="middle" transform="rotate(-90 614 275)">20'-0" DEEP</text>
  <line x1="150" y1="600" x2="598" y2="600" class="dim"/><text x="374" y="614" class="ts" text-anchor="middle">32'-0" OVERALL</text>

  <!-- ===================== LOFT FLOOR PLAN ===================== -->
  <text x="28" y="660" class="th">2 · LOFT FLOOR PLAN  (≈9 ft level)</text>
  <text x="28" y="676" class="ts">studio over the 16 ft center · balcony on left container roof</text>

  <!-- loft 16x20 over center ; origin 262,700 ; 14px/ft -> 224 wide, 280 deep -->
  <rect x="262" y="700" width="224" height="280" class="fill"/>
  <!-- overlook (open to gym below) along front edge -->
  <rect x="262" y="952" width="224" height="28" class="open" stroke-dasharray="4 3"/>
  <text x="374" y="970" class="ts" text-anchor="middle">OPEN OVERLOOK / RAIL</text>
  <!-- stair arrival -->
  <rect x="266" y="704" width="44" height="60" class="lnT"/>
  <text x="288" y="738" class="ts" text-anchor="middle">↑ stair</text>
  <!-- queen bed -->
  <rect x="296" y="712" width="70" height="92" class="lnT"/>
  <text x="331" y="762" class="ts" text-anchor="middle">QUEEN BED</text>
  <!-- kitchenette -->
  <rect x="396" y="704" width="86" height="26" class="lnT"/>
  <text x="439" y="722" class="ts" text-anchor="middle">KITCHENETTE</text>
  <!-- half-bath (enclosed, door) -->
  <rect x="404" y="852" width="78" height="76" class="lnT"/>
  <text x="443" y="884" class="ts" text-anchor="middle">HALF-BATH</text>
  <text x="443" y="898" class="ts" text-anchor="middle">wc + sink</text>
  <rect x="404" y="900" width="8" height="22" fill="#143a63" stroke="#cfe3f7"/>
  <!-- sofa -->
  <rect x="300" y="884" width="60" height="40" class="lnT"/>
  <text x="330" y="908" class="ts" text-anchor="middle">sofa</text>
  <!-- balcony door + balcony on left container roof (to the left) -->
  <rect x="258" y="820" width="8" height="34" fill="#143a63" stroke="#cfe3f7"/>
  <text x="247" y="812" class="ts" text-anchor="end">balcony door →</text>
  <rect x="150" y="780" width="100" height="150" class="lnT"/>
  <text x="200" y="852" class="ts" text-anchor="middle">ROOFTOP</text>
  <text x="200" y="866" class="ts" text-anchor="middle">BALCONY</text>
  <text x="200" y="942" class="ts" text-anchor="middle">(on left container roof)</text>
  <!-- bath plumbing stacks over downstairs utility (note) -->
  <text x="500" y="892" class="ts" fill="#4aa3ff">↳ stack plumbing over utility below (short runs)</text>

  <!-- ===================== SECTION A-A ===================== -->
  <text x="28" y="1030" class="th">3 · SECTION A-A</text>
  <text x="28" y="1046" class="ts">looking down the length · two stories, ~19 ft ridge</text>

  <!-- heights: ground 1300 ; 14px/ft. ridge ~19' -> 1300-266=1034 ; loft 9' -> 1300-126=1174 -->
  <line x1="120" y1="1300" x2="700" y2="1300" class="ln"/>
  <text x="120" y="1316" class="ts">grade · slab + footings</text>
  <!-- containers (side walls, 8.5') -->
  <rect x="150" y="1181" width="120" height="119" class="fill"/>
  <rect x="490" y="1181" width="120" height="119" class="fill"/>
  <text x="210" y="1248" class="ts" text-anchor="middle">CONTAINER</text>
  <text x="550" y="1248" class="ts" text-anchor="middle">CONTAINER</text>
  <!-- center two-story walls 0..17 -->
  <line x1="270" y1="1300" x2="270" y2="1062" class="ln"/>
  <line x1="490" y1="1300" x2="490" y2="1062" class="ln"/>
  <!-- loft floor at 9' -->
  <line x1="270" y1="1174" x2="490" y2="1174" class="ln"/>
  <text x="380" y="1168" class="ts" text-anchor="middle">LOFT FLOOR (~9')</text>
  <!-- garage door opening (ground center) -->
  <rect x="320" y="1188" width="120" height="112" fill="#0e2a4a" stroke="#6fa8d6" stroke-dasharray="4 3"/>
  <text x="380" y="1250" class="ts" text-anchor="middle">drive-through</text>
  <!-- gable roof to ridge 19' -->
  <path class="ln" d="M262 1062 L380 1034 L498 1062"/>
  <text x="380" y="1026" class="ts" text-anchor="middle">RIDGE ~19'</text>
  <!-- balcony on left container roof -->
  <line x1="150" y1="1181" x2="270" y2="1181" class="ln"/>
  <rect x="150" y="1176" width="120" height="5" fill="#143a63" stroke="#cfe3f7"/>
  <line x1="150" y1="1181" x2="150" y2="1158" class="lnT"/>
  <line x1="150" y1="1158" x2="270" y2="1158" class="lnT"/>
  <text x="200" y="1152" class="ts" text-anchor="middle">BALCONY + RAIL</text>
  <!-- soil/drain stub -->
  <path class="drain" d="M380 1300 L380 1330 L120 1330" />
  <text x="250" y="1326" class="ts" fill="#ff9a3c">drain → septic</text>
  <!-- height dims -->
  <line x1="112" y1="1181" x2="112" y2="1300" class="dim"/><text x="104" y="1245" class="ts" text-anchor="middle" transform="rotate(-90 104 1245)">8'-6"</text>
  <line x1="706" y1="1034" x2="706" y2="1300" class="dim"/><text x="714" y="1170" class="ts" text-anchor="middle" transform="rotate(-90 714 1170)">~19' RIDGE</text>

  <!-- ===================== LEGEND + TITLE BLOCK ===================== -->
  <text x="28" y="1372" class="th">MEP LEGEND</text>
  <line x1="28" y1="1388" x2="60" y2="1388" class="water"/><text x="68" y="1392" class="ts">water supply</text>
  <line x1="160" y1="1388" x2="192" y2="1388" class="drain"/><text x="200" y="1392" class="ts">waste / drain</text>
  <line x1="300" y1="1388" x2="332" y2="1388" class="elec"/><text x="340" y="1392" class="ts">electrical</text>
  <line x1="430" y1="1388" x2="462" y2="1388" class="septic"/><text x="470" y="1392" class="ts">septic / drain field</text>

  <rect x="520" y="1340" width="270" height="150" class="ln"/>
  <line x1="520" y1="1378" x2="790" y2="1378" class="lnT"/>
  <line x1="520" y1="1430" x2="790" y2="1430" class="lnT"/>
  <line x1="655" y1="1430" x2="655" y2="1490" class="lnT"/>
  <text x="532" y="1364" class="t">TWO-CONTAINER BARN GYM</text>
  <text x="532" y="1400" class="ts">MIDDLE TENNESSEE · STD CONTAINERS</text>
  <text x="532" y="1414" class="ts">GYM + LOFT STUDIO + BALCONY</text>
  <text x="532" y="1452" class="ts">DRAWN: FIELDBOOK</text>
  <text x="532" y="1468" class="ts">NOT FOR CONSTRUCTION</text>
  <text x="667" y="1452" class="ts">SHEET</text>
  <text x="667" y="1472" class="t">A-1</text>

  <text x="28" y="1476" class="ts">Loft floor, stairs, garage headers, truss/roof, wall cuts, slab &amp; septic all require a</text>
  <text x="28" y="1490" class="ts">licensed engineer's stamp and county permits before construction.</text>
</svg>
</div>
</body>
</html>
